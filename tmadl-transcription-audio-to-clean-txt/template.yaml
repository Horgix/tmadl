AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  tmadl-transcription-audio-to-clean-txt

  Lambdas and Step Function workflow to:
  - Take an audio file from S3
  - Transcribe it using AWS Transcribe
  - Clean the JSON resulting from AWS Transcribe into a cleaner per-speaker text file
Globals:
  Function:
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true

Parameters:
  RawRecordingsPrefix:
    Type: String
    Default: recordings-raw
    Description: The prefix for the S3 bucket where the audio files will be stored
  RawTranscriptionsPrefix:
    Type: String
    Default: transcriptions-raw
    Description: The prefix for the S3 bucket where the transcriptions will be stored
  CleanTranscriptionsPrefix:
    Type: String
    Default: transcriptions-clean
    Description: The prefix for the S3 bucket where the processed transcriptions will be stored

Resources:
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: payfit-dev-horgix-transcriptions-2025-eu-west-3-v2
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  TriggerSummaryGeneratorStateMachineEventRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          Sid: EventBridgeAccess
          Effect: Allow
          Principal:
            Service:
              - events.amazonaws.com
          Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !GetAtt AudioToCleanTxtTranscription.Arn

  TriggerTranscriptionStateMachineEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tmadl-audio-upload-to-s3-trigger-stepfunction
      Description: Invokes the audio-to-clean-txt Step Function when a recording is
        put in the asset bucket recordings folder
      State: ENABLED
      Targets:
        - Arn: !GetAtt AudioToCleanTxtTranscription.Arn
          Id: InvokeSummaryGeneratorStateMachine
          RoleArn: !GetAtt TriggerSummaryGeneratorStateMachineEventRuleRole.Arn
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref AssetsBucket
          object:
            key:
              - prefix: !Ref RawRecordingsPrefix

  FlattenS3TagSetLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/flatten_s3_tagset/
      Handler: app.lambda_handler
      Runtime: python3.10

  TranscriptionToCleanTxtLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/aws_transcription_to_clean_txt/
      Handler: app.lambda_handler
      Runtime: python3.10
      Timeout: 30
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - s3:getObject
            Resource: !Sub arn:aws:s3:::${AssetsBucket}/${RawRecordingsPrefix}/*
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject # For the lambda to read the transcription file
              - s3:HeadObject # For the lambda to read the transcription file
            Resource: !Sub arn:aws:s3:::${AssetsBucket}/${RawTranscriptionsPrefix}/*
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject # For AWS Transcribe to write the transcription file, and for the lambda to write the clean txt file
            Resource:
              - !Sub arn:aws:s3:::${AssetsBucket}/${RawTranscriptionsPrefix}/*
              - !Sub arn:aws:s3:::${AssetsBucket}/${CleanTranscriptionsPrefix}/*
        - Statement:
            Effect: Allow
            Action:
              - s3:ListBucket # For the lambda to read the transcription file
            Resource: !Sub arn:aws:s3:::${AssetsBucket}

  AudioToCleanTxtTranscription:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/transcription_audio_to_clean_txt.asl.json
      DefinitionSubstitutions:
        FlattenS3TagSetLambdaArn: !GetAtt FlattenS3TagSetLambda.Arn
        TranscriptionToCleanTxtLambdaArn: !GetAtt TranscriptionToCleanTxtLambda.Arn
      # Policies that allow the AWS StepFunction state machine to invoke whatever it needs to
      # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FlattenS3TagSetLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref TranscriptionToCleanTxtLambda
        - Statement: # For the steps that start the AWS Transcribe transcription job and watch/wait for it
            Effect: Allow
            Action:
              - transcribe:StartTranscriptionJob
              - transcribe:GetTranscriptionJob
            Resource: !Sub arn:aws:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/*
        - Statement: # For the step that get the recording object tags
            Effect: Allow
            Action:
              - s3:GetObjectTagging
            Resource: !Sub arn:aws:s3:::${AssetsBucket}/${RawRecordingsPrefix}/*
        - Statement: # For Transcribe's permission pre-check on the input audio and output location
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub arn:aws:s3:::${AssetsBucket}/${RawRecordingsPrefix}/*
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub arn:aws:s3:::${AssetsBucket}/${RawTranscriptionsPrefix}/*
        - Statement:
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub arn:aws:s3:::${AssetsBucket}

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
      Tags:
        - Key: "payfit.net/team"
          Value: dre
        - Key: "payfit.net/managed-by"
          Value: sam
        - Key: "payfit.net/created-by"
          Value: alexis.chotard
        - Key: "payfit.net/description"
          Value: personal-notes-summarizing-tooling
        - Key: "payfit.net/env"
          Value: dev

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'
      Tags:
        - Key: "payfit.net/team"
          Value: dre
        - Key: "payfit.net/managed-by"
          Value: sam
        - Key: "payfit.net/created-by"
          Value: alexis.chotard
        - Key: "payfit.net/description"
          Value: personal-notes-summarizing-tooling
        - Key: "payfit.net/env"
          Value: dev

Outputs:
  # TranscriptionSAudioToCleanTxtTranscriptionHourlyTradingSchedule is an implicit Schedule event rule created out of Events key under Serverless::StateMachine
  # Find out more about other implicit resources you can reference within SAM
  # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-generated-resources.html
  AudioToCleanTxtTranscriptionArn:
    Description: Audio transcription
    Value: !Ref AudioToCleanTxtTranscription
  AssetsBucketName:
    Description: Name of the S3 bucket for audio files and transcriptions
    Value: !Ref AssetsBucket
